name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: gateway-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pgateway-test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      LANCER_NEXUS_GATEWAY_TEST_MYSQL: Server=127.0.0.1;Port=3306;User ID=root;Password=gateway-test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore tests/LancerNexus.Gateway.Tests/LancerNexus.Gateway.Tests.csproj
      - run: dotnet format tests/LancerNexus.Gateway.Tests/LancerNexus.Gateway.Tests.csproj --verify-no-changes --no-restore
      - run: dotnet build tests/LancerNexus.Gateway.Tests/LancerNexus.Gateway.Tests.csproj --configuration Release --no-restore --warnaserror
      - run: dotnet test tests/LancerNexus.Gateway.Tests/LancerNexus.Gateway.Tests.csproj --configuration Release --no-build --logger trx --collect:"XPlat Code Coverage"
